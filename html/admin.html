<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel administrativo · Verde&Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="header admin-header">
    <div class="container header__inner">
      <a href="index.html" class="logo" id="admin-logo">Verde<span>&Co</span></a>

      <div class="header-spacer"></div>

      <span id="admin-welcome" class="user-welcome"></span>

      <div id="user-menu-container" class="user-menu-container hidden">
        <button id="user-menu-btn" class="user-menu-btn">
          <span id="user-menu-name"></span> ▼
        </button>
        <div id="user-menu" class="user-menu hidden">
          <button id="user-theme-toggle" class="user-menu-item">
            <span id="theme-icon">🌙</span> Modo oscuro
          </button>
          <button id="user-logout" class="user-menu-item logout">🚪 Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </header>

  <main class="admin-page">
    <div class="container">
      <div class="admin-page__top">
        <div>
          <p class="admin-panel__eyebrow">Acceso administrativo</p>
          <h1>Panel de usuarios</h1>
        </div>
        <button id="admin-reset-form" type="button" class="btn btn--ghost">Nuevo usuario</button>
      </div>

      <form id="admin-user-form" class="admin-user-form">
        <input type="hidden" id="admin-user-id" />

        <div class="admin-form-grid">
          <div class="form-group">
            <label for="admin-nombre">Nombre completo</label>
            <input type="text" id="admin-nombre" required />
          </div>

          <div class="form-group">
            <label for="admin-email">Correo electrónico</label>
            <input type="email" id="admin-email" required />
          </div>

          <div class="form-group">
            <label for="admin-password">Contraseña</label>
            <input type="text" id="admin-password" placeholder="Ingrese contraseña" required />
          </div>

          <div class="form-group">
            <label for="admin-telefono">Teléfono</label>
            <input type="tel" id="admin-telefono" />
          </div>

          <div class="form-group">
            <label for="admin-ciudad">Ciudad</label>
            <input type="text" id="admin-ciudad" />
          </div>

          <div class="form-group">
            <label for="admin-fecha-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="admin-fecha-nacimiento" required />
          </div>

          <div class="form-group">
            <label for="admin-tipo-usuario">Tipo de usuario</label>
            <select id="admin-tipo-usuario" required>
              <option value="Cliente">Cliente</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
        </div>

        <div class="admin-form-actions">
          <button type="submit" class="btn btn--primary" id="admin-submit-btn">Guardar usuario</button>
          <button type="button" id="admin-cancel-edit" class="btn btn--ghost hidden">Cancelar edición</button>
        </div>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Tipo</th>
              <th>Ciudad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-users-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
